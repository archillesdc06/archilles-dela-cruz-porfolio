<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" rx="12" fill="url(#bgGrad)" />
  
  <!-- Content -->
  <!-- Grid representation -->
  <path d="M 50 0 L 50 250 M 100 0 L 100 250 M 150 0 L 150 250 M 200 0 L 200 250 M 255 0 L 255 250 M 300 0 L 300 250 M 350 0 L 350 250" stroke="#cbd5e1" stroke-width="0.5" opacity="0.3" />
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200" stroke="#cbd5e1" stroke-width="0.5" opacity="0.3" />

  <!-- Mock Device (Phone) -->
  <rect x="70" y="40" width="110" height="180" rx="16" fill="#0f172a" />
  <rect x="75" y="50" width="100" height="150" rx="8" fill="#1e293b" />
  <rect x="80" y="60" width="90" height="130" rx="6" fill="#334155" />
  
  <!-- Mock Accessories inside phone -->
  <circle cx="125" cy="95" r="18" fill="url(#blueGrad)" />
  <!-- Headphones Icon inside phone -->
  <path d="M 115 98 A 10 10 0 0 1 135 98 M 113 95 L 117 95 L 117 101 L 113 101 Z M 133 95 L 137 95 L 137 101 L 133 101 Z" stroke="#ffffff" stroke-width="2" fill="none" />
  
  <!-- Inventory Transfers Arrows -->
  <path d="M 200 100 L 250 100 M 240 90 L 250 100 L 240 110" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 250 140 L 200 140 M 210 130 L 200 140 L 210 150" stroke="#4f46e5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mini Dashboard Branch Cards -->
  <rect x="260" y="55" width="80" height="40" rx="8" fill="#ffffff" box-shadow="0 4px 6px -1px rgba(0,0,0,0.1)" />
  <rect x="270" y="65" width="40" height="6" rx="3" fill="#2563eb" />
  <rect x="270" y="77" width="20" height="6" rx="3" fill="#94a3b8" />
  <circle cx="325" cy="75" r="6" fill="#4ade80" />

  <rect x="260" y="115" width="80" height="40" rx="8" fill="#ffffff" />
  <rect x="270" y="125" width="30" height="6" rx="3" fill="#4f46e5" />
  <rect x="270" y="137" width="45" height="6" rx="3" fill="#94a3b8" />
  <circle cx="325" cy="135" r="6" fill="#f87171" />

  <!-- Branch Connection Pins -->
  <circle cx="125" cy="170" r="4" fill="#64748b" />
  <line x1="125" y1="170" x2="260" y2="75" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="125" y1="170" x2="260" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
</svg>
