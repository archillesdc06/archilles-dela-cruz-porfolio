  <!-- Stars on top of 1st place -->
  <path d="M 200 50 L 203 58 L 212 59 L 205 65 L 207 74 L 200 69 L 193 74 L 195 65 L 188 59 L 197 58 Z" fill="#eab308" />
  <path d="M 160 75 L 161 80 L 167 81 L 162 85 L 163 91 L 158 88 L 153 91 L 154 85 L 149 81 L 155 80 Z" fill="#eab308" opacity="0.7" />
  <path d="M 240 75 L 241 80 L 247 81 L 242 85 L 243 91 L 238 88 L 233 91 L 234 85 L 229 81 L 235 80 Z" fill="#eab308" opacity="0.7" />

  <!-- Score Tag -->
  <rect x="175" y="218" width="50" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="200" y="231" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Score: 9.8</text>
