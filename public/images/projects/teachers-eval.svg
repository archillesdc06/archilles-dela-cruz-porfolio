  <rect x="90" y="130" width="60" height="80" rx="6" fill="#94a3b8" />
  <text x="120" y="175" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">2</text>
  
  <!-- 1st Place -->
  <rect x="170" y="90" width="60" height="120" rx="6" fill="url(#purpleGrad)" />
  <text x="200" y="155" font-family="sans-serif" font-weight="bold" font-size="36" fill="#ffffff" text-anchor="middle">1</text>
  
