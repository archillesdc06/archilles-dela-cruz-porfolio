<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" rx="12" fill="url(#bgGrad)" />
  
  <!-- Content Grid Grid Lines -->
  <path d="M 50 0 L 50 250 M 100 0 L 100 250 M 150 0 L 150 250 M 200 0 L 200 250 M 250 0 L 250 250 M 300 0 L 300 250 M 350 0 L 350 250" stroke="#cbd5e1" stroke-width="0.5" opacity="0.3" />
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200" stroke="#cbd5e1" stroke-width="0.5" opacity="0.3" />

  <!-- Folder/Document -->
  <!-- Base Folder Back -->
  <path d="M 80 80 L 130 80 L 145 95 L 280 95 L 280 180 L 80 180 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Papers popping out -->
  <rect x="100" y="60" width="140" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="120" y1="80" x2="220" y2="80" stroke="#cbd5e1" stroke-width="2" />
  <line x1="120" y1="95" x2="200" y2="95" stroke="#cbd5e1" stroke-width="2" />
  <line x1="120" y1="110" x2="220" y2="110" stroke="#cbd5e1" stroke-width="2" />
  <line x1="120" y1="125" x2="170" y2="125" stroke="#cbd5e1" stroke-width="2" />

  <!-- Folder Front Cover -->
  <path d="M 80 100 L 140 100 L 155 115 L 280 115 L 280 185 L 80 185 Z" fill="url(#cyanGrad)" opacity="0.95" />
  
  <!-- Search/Track magnifying glass -->
  <circle cx="270" cy="80" r="22" fill="#ffffff" stroke="#06b6d4" stroke-width="2" />
  <!-- Routing Map inside lens -->
  <circle cx="270" cy="80" r="14" fill="#ecfeff" />
  <path d="M 260 85 Q 270 70 280 80" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="260" cy="85" r="3" fill="#2563eb" />
  <circle cx="280" cy="80" r="3" fill="#06b6d4" />
  
  <!-- Handle -->
  <line x1="285" y1="95" x2="305" y2="115" stroke="#06b6d4" stroke-width="4.5" stroke-linecap="round" />

  <!-- Approved Stamp Badge -->
  <g transform="translate(195, 125) rotate(-10)">
    <rect x="0" y="0" width="80" height="28" rx="4" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <text x="40" y="19" font-family="sans-serif" font-weight="extrabold" font-size="12" fill="#22c55e" text-anchor="middle" letter-spacing="1">ROUTED</text>
  </g>
</svg>
