name: AI Analysis Drafts

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-analysis-drafts
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ANALYSIS_API_KEY: ${{ secrets.AI_ANALYSIS_API_KEY }}
      AI_ANALYSIS_BASE_URL: ${{ vars.AI_ANALYSIS_BASE_URL }}
      AI_ANALYSIS_MODEL: ${{ vars.AI_ANALYSIS_MODEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Analyze Drive certifications
        continue-on-error: true
        run: npm run ai:analyze:certifications

      - name: Analyze GitHub projects
        continue-on-error: true
        run: npm run ai:analyze:projects

      - name: Check draft files
        run: git diff --check

      - name: Create AI draft review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-analysis-drafts
          title: "chore: review AI portfolio metadata drafts"
          body: |
            AI-generated certification and project metadata is kept in draft files for manual review.
            Review the proposed title, description, issuer, year, category, and technology stack before running the promotion command.
            Approved metadata is not changed by this workflow.
          commit-message: "chore: refresh AI portfolio metadata drafts"
          add-paths: |
            src/data/certification-analysis-drafts.json
            src/data/project-analysis-drafts.json
          delete-branch: true
