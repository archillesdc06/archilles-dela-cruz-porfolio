name: Auto Screenshots

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Enable corepack (pnpm/yarn support)
        run: corepack enable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run auto screenshot pipeline
        env:
          GITHUB_USERNAME: archillesdc06
          # Optional JSON secret: {"repo-name":{"user":"...","pass":"..."}}
          DEMO_LOGINS: ${{ secrets.DEMO_LOGINS }}
        run: node scripts/auto-screenshots.mjs

      - name: Commit screenshots
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/images/projects src/data/github-metadata.json src/data/screenshot-sources.json
            git commit -m "chore: auto-update project screenshots [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi